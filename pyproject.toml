[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cinema"
version = "0.1.0"
description = "Script Continuity & Breakdown Agent for pre-production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
gemini = ["google-genai>=1.0.0"]

[project.scripts]
breakdown = "agentic_cinema.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agentic_cinema*", "agents*"]
